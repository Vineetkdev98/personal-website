server:
  port: 8081

spring:
  application:
    name: profile-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5442/personal_db}
    username: ${SPRING_DATASOURCE_USERNAME:personal_user}
    password: ${SPRING_DATASOURCE_PASSWORD:personal_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always