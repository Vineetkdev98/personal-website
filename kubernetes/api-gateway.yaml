apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: personal-website

spec:

  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:

    metadata:
      labels:
        app: api-gateway

    spec:

      containers:

        - name: api-gateway

          image: personal-api-gateway:3.0

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 8080

          env:

            - name: PROFILE_SERVICE_URL
              value: http://profile-service:8081


---

apiVersion: v1
kind: Service

metadata:
  name: api-gateway
  namespace: personal-website

spec:

  selector:
    app: api-gateway

  ports:

    - port: 8080
      targetPort: 8080