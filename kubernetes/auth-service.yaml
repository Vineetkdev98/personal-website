apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: personal-website

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:

    metadata:
      labels:
        app: auth-service

    spec:

      containers:

        - name: auth-service

          image: personal-auth-service:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          env:

            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/personal_db

            - name: SPRING_DATASOURCE_USERNAME
              value: personal_user

            - name: SPRING_DATASOURCE_PASSWORD
              value: personal_password

            - name: JWT_SECRET
              value: bXktcGVyc29uYWwtd2Vic2l0ZS1qd3Qtc2VjcmV0LWtleS0yMDI2

---

apiVersion: v1
kind: Service

metadata:
  name: auth-service
  namespace: personal-website

spec:

  selector:
    app: auth-service

  ports:

    - protocol: TCP
      port: 8082
      targetPort: 8082

  type: ClusterIP